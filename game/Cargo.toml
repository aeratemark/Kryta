[package]
name = "game"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
common = { path = "../common" }
database = { path = "../database" }
shared = { path = "../shared" }
# The portal's session and token identifiers come from the operating system's entropy.
getrandom = "0.2"
# A query's rows are read as postgres::Row, which is the type the pool answers with: the
# account repository beside this crate's other nouns reads rows the same way the programs do.
postgres = "0.19"

# The custom title portal route sends the configured public catalog as JSON.
serde_json = "1"

# Skill scripts (`game/Scripting/SkillScripts.rs`, `docs/decisions/0016-skills-are-lua-scripts.md`): Lua 5.4,
# built from source so no system Lua is needed; `serialize` turns a queued operation into the JSON value the
# skill catalogue's reader takes; `send` lets the engine hold the state behind a Mutex across threads.
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize", "send"] }
